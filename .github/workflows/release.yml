name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # OIDC token for npm Trusted Publishing (no NPM_TOKEN) and provenance attestations.
  id-token: write

jobs:
  release:
    name: Version or publish @quami/sendo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@quami"

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Changesets guard
        run: pnpm check:changesets

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm authenticates with the job's OIDC token via the Trusted Publisher configured on
          # npmjs.com (quamidev/sendo, release.yml); there is no npm token secret.
          NPM_CONFIG_PROVENANCE: "true"
